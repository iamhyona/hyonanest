    d.defaultView.addEventListener('scroll', function () { if (FS.lock || FS.f !== f) return; var y = d.defaultView.scrollY; if (Math.abs(fsInner() - y) > 1) { FS.lock = 1; window.scrollTo(0, Math.max(0, window.scrollY + w.getBoundingClientRect().top - fsTop() + y)); FS.lock = 0; } }, { passive: true });
  }
  var ch = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight), vh = Math.max(240, window.innerHeight - fsTop());
  if (Math.abs(f.offsetHeight - vh) > 1) f.style.height = vh + 'px';
  f.style.position = 'sticky'; f.style.top = fsTop() + 'px';
  var H = Math.max(ch, vh) + 16; if (Math.abs(H - FS.h) > 1) { FS.h = H; w.style.height = H + 'px'; w.style.boxSizing = 'border-box'; }
  fsSync();
}
function fsInner() { var w = $('#fw'); return Math.max(0, fsTop() - w.getBoundingClientRect().top); }
function fsSync() { var f = FS.f; if (!f || FS.lock || f.classList.contains('fmon')) return; try { var win = f.contentWindow, y = fsInner(); if (Math.abs(win.scrollY - y) > 1) { FS.lock = 1; win.scrollTo(0, y); FS.lock = 0; } } catch (e) {} }
window.addEventListener('scroll', fsSync, { passive: true });
window.addEventListener('resize', function () { FS.h = 0; fsTick(); });
setInterval(fsTick, 400);

/* 앱 안 팝업: 뒤 화면은 그대로, 바깥(메뉴)도 같은 색으로 어둡게, 상자는 왼쪽 메뉴를 뺀 공간 정가운데 (PLYSH와 같은 규칙) */
function fmFind(d) {
  try {
    var w = d.defaultView, vw = w.innerWidth, vh = w.innerHeight, hit = null;
    var n = [[3, 3], [vw - 3, 3], [3, vh - 3], [vw - 3, vh - 3]].filter(function (pt) {
      var e = d.elementFromPoint(pt[0], pt[1]);
      while (e && e !== d.body && e !== d.documentElement) { var cs = w.getComputedStyle(e); if (cs.position === 'fixed' && cs.visibility !== 'hidden' && cs.display !== 'none' && +cs.opacity > 0.05) { var r = e.getBoundingClientRect(); if (r.width >= vw * 0.9 && r.height >= vh * 0.9) { hit = e; return true; } } e = e.parentElement; }
      return false;
    }).length;
    return n >= 3 ? hit : null;
  } catch (x) { return null; }
}
function fmCheck(f) {
  var d; try { d = f.contentDocument; } catch (x) { return; } if (!d) return;
  var el = fmFind(d), was = f.classList.contains('fmon');
  if (el) {
    if (!was) {
      f.classList.add('fmon');
      var dim = document.createElement('div'); dim.id = 'fmDim'; document.body.appendChild(dim);
      var cat = document.createElement('div'); cat.id = 'fmCat'; document.body.appendChild(cat);
      cat.onclick = function () { var t = f._fmEl; if (t) t.dispatchEvent(new MouseEvent('click', { bubbles: true })); setTimeout(function () { fmCheck(f); }, 50); };
      cat.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false }); cat.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    }
    f._fmEl = el;
    var bg = d.defaultView.getComputedStyle(el).backgroundColor; $('#fmDim').style.background = bg && bg !== 'rgba(0, 0, 0, 0)' ? bg : 'rgba(0,0,0,.4)';
  } else if (was) {
    f.classList.remove('fmon'); f._fmEl = null;
    ['fmDim', 'fmCat'].forEach(function (id) { var x = document.getElementById(id); if (x) x.parentNode.removeChild(x); });
  }
}
function fmWatch(f, d) {
  if (d._fmw) return; d._fmw = 1; var t = 0;
  var run = function () { if (t) return; t = requestAnimationFrame(function () { t = 0; fmCheck(f); }); };
  new MutationObserver(run).observe(d.documentElement, { attributes: true, childList: true, subtree: true, attributeFilter: ['class', 'style', 'hidden', 'open'] });
  d.addEventListener('transitionend', run, true); d.addEventListener('click', function () { setTimeout(run, 0); setTimeout(run, 320); }, true);
}

/* ───── 날짜 ───── */
var WD = ['일', '월', '화', '수', '목', '금', '토'];
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
var NOW = new Date(), TODAY = ymd(NOW);
function dShort(s) { if (!s) return ''; var d = new Date(s.slice(0, 10) + 'T00:00:00'); if (isNaN(d)) return esc(s); return '<span class="d">' + s.slice(2, 4) + '.' + s.slice(5, 7) + '.' + s.slice(8, 10) + '<small>' + WD[d.getDay()] + '</small></span>'; }
function won(n) { return Math.round(n).toLocaleString('ko-KR'); }

/* ───── 오늘 (루틴·가계부가 이 기기에 저장해 둔 기록을 읽음) ───── */
function jget(k) { try { return JSON.parse(ls.get(k) || 'null'); } catch (e) { return null; } }
var BOOKN = { hyuna: '땡깡', share: '공용', pitch: '핏치' };
function yearRows(b) { var d = jget('money:yr:' + b + NOW.getFullYear()); return d && d.rows || []; }
function sv(r) { return r.type === '취소' ? -r.amt : r.amt; }
var FOOD_CATS = ['아침', '아점', '점심', '점저', '저녁', '야식', '간식', '음료', '카페', '음식'];
function kcalOf(t) { var m = String(t || '').match(/([\d,]+)\s*kcal/i); return m ? +m[1].replace(/,/g, '') : 0; }
var V = {};
V.today = function () {
  var D = jget('memo:data') || {}, m = NOW.getMonth() + 1;
  var spent = [], todayE = 0, monE = 0, monI = 0, any = false;
  Object.keys(BOOKN).forEach(function (b) {
    var rows = yearRows(b); if (rows.length) any = true;
    rows.forEach(function (r) {
      if (r.date === TODAY && r.type !== '수입') { todayE += sv(r); spent.push([b, r]); }
      if (b === 'hyuna' && r.m === m) { if (r.type === '수입') monI += r.amt; else monE += sv(r); }
    });
  });
  spent.sort(function (a, b) { return String(b[1].time || '').localeCompare(String(a[1].time || '')); });
  var food = (D.photos || []).filter(function (p) { return p.d === TODAY && FOOD_CATS.indexOf(p.cat) >= 0; });
  var kcal = food.reduce(function (s, p) { return s + kcalOf(p.memo); }, 0);
  var todos = (D.todos || []).filter(function (t) { return !t.done && t.kind !== '메모' && t.due && t.due <= TODAY; }).sort(function (a, b) { return a.due < b.due ? -1 : 1; });
  var memos = (D.memos || []).slice(0, 4);
  var h = '<div class="crumb" style="margin:-12px 0 12px">' + dShort(TODAY) + '</div><div class="grid3 kp3">' +
    '<div class="box kpi ex"><span>오늘 쓴 돈</span><b>' + won(todayE) + '</b><em>세 가계부 합계</em></div>' +
    '<div class="box kpi ex"><span>' + m + '월 지출</span><b>' + won(monE) + '</b><em>땡깡</em></div>' +
    '<div class="box kpi in"><span>' + m + '월 수입</span><b>' + won(monI) + '</b><em>땡깡</em></div></div>';
  h += '<div class="sec">오늘 기록</div><div class="grid">';
  h += '<div class="box"><div class="bt">오늘 할 일<button class="lk" data-go="memo">메모' + ic('cv') + '</button></div><div class="rows">' +
    (todos.length ? todos.slice(0, 6).map(function (t) { return '<div class="row"><span class="t">' + esc(t.text) + (t.memo ? '<small>' + esc(t.memo) + '</small>' : '') + '</span><span class="m' + (t.due < TODAY ? ' od' : '') + '">' + (t.due < TODAY ? '지남' : '오늘') + '</span></div>'; }).join('')
      : '<div class="empty">오늘까지 할 일이 없어요</div>') + '</div></div>';
  h += '<div class="box"><div class="bt">오늘 쓴 돈<button class="lk" data-go="b-hyuna">가계부' + ic('cv') + '</button></div><div class="rows">' +
    (spent.length ? spent.slice(0, 6).map(function (x) { var r = x[1]; return '<div class="row"><span class="dot" style="background:var(--p3);color:#e8890c">' + ic('coin') + '</span><span class="t">' + esc(r.text || r.cat || '-') + '<small>' + BOOKN[x[0]] + (r.cat ? ' · ' + esc(r.cat) : '') + '</small></span><span class="amt ex">−' + won(sv(r)) + '</span></div>'; }).join('')
      : '<div class="empty">' + (any ? '오늘 쓴 돈이 없어요' : '가계부를 한 번 열면 여기에 보여요') + '</div>') + '</div></div>';
  h += '<div class="box"><div class="bt">식단<button class="lk" data-go="food">식단' + ic('cv') + '</button></div>' +
    (food.length ? '<div class="kpi"><b>' + won(kcal) + ' <small style="font-size:14px;color:var(--mute);font-weight:600">/ 1,600kcal</small></b></div><div class="meter"><i style="width:' + Math.min(100, kcal / 16) + '%"></i></div><div class="rows" style="margin-top:8px">' +
      food.map(function (p) { var k = kcalOf(p.memo); return '<div class="row"><span class="t">' + esc(p.cat) + '</span><span class="m">' + (k ? won(k) + 'kcal' : '') + '</span></div>'; }).join('') + '</div>'
      : '<div class="empty">오늘 올린 식단 사진이 없어요</div>') + '</div>';
  h += '<div class="box"><div class="bt">최근 메모<button class="lk" data-go="memo">메모' + ic('cv') + '</button></div><div class="rows">' +
    (memos.length ? memos.map(function (x) { return '<div class="row"><span class="t">' + esc(String(x.text || '').slice(0, 80)) + '</span><span class="m">' + dShort(x.d) + '</span></div>'; }).join('')
      : '<div class="empty">메모가 없어요</div>') + '</div></div>';
  return h + '</div>';
};

/* ───── 링크 모음 (예전 허브) ───── */
var GH = 'https://iamhyona.github.io/';
var LINKS = {
  'l-work': [['plysh', 'PLYSH', '디자인4팀 업무 웹앱', 'cal/apple-touch-icon.png'], ['pitch-master', '핏치', '핏치 정산 · 견적', 'pitch-master/apple-touch-icon.png?v=3'], ['worktime', '근무표', '근무 시간 기록', ''], ['proof', '사양서 도우미', 'PROOF', 'proof/apple-touch-icon.png']],
  'l-life': [['buza', '뚠냥 · 땡깡 가계부', '뚠냥과 같이 쓰는 가계부', 'buza/apple-touch-icon.png']],
  'l-game': [['games', '게임 허브', '모든 게임', 'games/icon.png'], ['fruitpang', '구슬팡', 'MARBLE PANG', 'fruitpang/icon-180.png'], ['petris', '페트리스', 'PETRIS', 'petris/icon-180.png?v=4'], ['switchpang', '스위치팡', 'SWITCH PANG', 'switchpang/apple-touch-icon.png?v=2'], ['pang', '팡야팡야', 'PANGYA PANGYA', 'pang/apple-touch-icon.png'], ['mines', '지뢰찾기', 'MINESWEEPER', 'mines/icon-180.png'], ['twinstar', '트윈스타', 'TWIN STAR', 'twinstar/icon-180.png'], ['bricks', '벽돌깨기', 'BRICKS', 'bricks/icon-180.png'], ['hangulbi', '한글비', 'HANGULBI', 'hangulbi/apple-touch-icon.png'], ['farm', '팡팡농장', 'PANG FARM', 'farm/icon-180.png?v=2']]
};
function links(k) {
  return '<div class="grid">' + LINKS[k].map(function (a) {
    var im = a[3] ? '<img src="' + GH + a[3] + '" alt="" loading="lazy">' : '<span class="ai" style="background:var(--p2);color:var(--green)">' + ic(k === 'l-game' ? 'game' : 'link') + '</span>';
    return '<a class="app-c" href="' + GH + a[0] + '/" target="_blank" rel="noopener">' + im + '<span class="tx"><b>' + esc(a[1]) + '</b><span>' + esc(a[2]) + '</span></span>' + ic('out') + '</a>';
  }).join('') + '</div>';
}
V['l-work'] = function () { return links('l-work'); };
V['l-life'] = function () { return links('l-life'); };
V['l-game'] = function () { return links('l-game'); };

/* ───── 가계부 저장본 새로 받기 (오늘 화면용, 가계부 앱과 같은 저장 형식) ───── */
function refreshMoney() {
  var pin = ls.get('money:pin'); if (!pin) return;
  var y = NOW.getFullYear();
  Object.keys(BOOKN).forEach(function (b) {
    call('money', 'appYear', pin, b, y).then(function (d) { ls.set('money:yr:' + b + y, JSON.stringify(d)); if (cur === 'today') render(); }).catch(function () {});
  });
}
window.addEventListener('storage', function (e) { if (cur === 'today' && e.key && /^(memo:data|money:yr:)/.test(e.key)) render(); });

/* ───── 구글 로그인: 실장님 계정 하나만 ───── */
var gsiP = null;
function gsiLoad() {
  return gsiP || (gsiP = new Promise(function (ok, no) {
    var s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = ok; s.onerror = function () { gsiP = null; no(new Error('구글 로그인을 불러오지 못했어요')); };
    document.head.appendChild(s);
  }));
}
function jwtMail(cred) { try { var p = cred.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return String(JSON.parse(decodeURIComponent(escape(atob(p)))).email || '').toLowerCase(); } catch (e) { return ''; } }
function lgErr(m) { var x = $('#lgErr'); x.textContent = m; x.classList.toggle('hide', !m); }
function showLogin(msg) {
  $('#lg').classList.remove('hide'); $('#lgMsg').textContent = msg || '실장님 구글 계정으로 로그인해 주세요.'; lgErr('');
  gsiLoad().then(function () {
    google.accounts.id.initialize({ client_id: GCID, callback: lgDone, ux_mode: 'popup', auto_select: false });
    $('#gBtn').innerHTML = '';
    google.accounts.id.renderButton($('#gBtn'), { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', locale: 'ko', width: 240 });
  }).catch(function (e) { lgErr(e.message); });
}
function lgDone(r) {
  var mail = jwtMail(r.credential);
  if (mail !== OWNER) return lgErr('실장님 계정만 들어올 수 있어요' + (mail ? ' (' + mail + ')' : ''));
  $('#gBtn').classList.add('busy');
  // 루틴·가계부 서버에 같은 구글 로그인으로 열쇠를 받아 둠 (PIN 대신)
  Promise.all(['memo', 'money'].map(function (app) {
    return call(app, 'appLogin', r.credential).then(function (o) { ls.set(PINKEY[app], o.tok); return true; }, function (e) { return ls.get(PINKEY[app]) ? true : e.message; });
  })).then(function (res) {
    var bad = res.filter(function (x) { return x !== true; });
    if (bad.length) { lgErr('서버 로그인이 안 됐어요: ' + bad[0]); return; }
    ls.set('hn:ok', mail); enter(true);
  }).then(function () { $('#gBtn').classList.remove('busy'); });
}
var started = false;
function enter(fresh) {
  $('#lg').classList.add('hide');
  if (fresh) { $$('#fw iframe').forEach(function (f) { f.parentNode.removeChild(f); }); }
  var h = location.hash.slice(1); go(find(h) ? h : (ls.get('hn:view') || 'today'), true);
  if (!started) { started = true; setTimeout(function () { frame('routine', 'memo'); }, 600); refreshMoney(); }
}
// 루틴·가계부 안에서 로그인이 풀리면 여기로 (PIN 화면 대신)
window.hnAuth = function (app) { ls.set(PINKEY[app], ''); ls.set('hn:ok', ''); showLogin('로그인이 풀렸어요. 다시 로그인해 주세요.'); };
function logout() { ['hn:ok', 'memo:pin', 'money:pin'].forEach(function (k) { ls.set(k, ''); }); try { google.accounts.id.disableAutoSelect(); } catch (e) {} location.reload(); }

function closeD() { $('#side').classList.remove('open'); $('#dbg').classList.remove('open'); }
$('#menuBtn').onclick = function () { $('#side').classList.add('open'); $('#dbg').classList.add('open'); };
$('#dbg').onclick = closeD;
window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h !== cur && find(h)) go(h); });

if (ls.get('hn:ok') === OWNER) enter(false); else { side(); showLogin(); }
</script>
